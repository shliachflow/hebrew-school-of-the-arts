name: Render content

on:
  push:
    branches: [main]
    paths: ['content/**', 'build.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Render content/site.json into the HTML
        run: python build.py

      - name: Commit if the HTML changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            # [skip ci] so this commit does not retrigger the workflow
            git commit -m "Render content/site.json [skip ci]"
            git push
          else
            echo "No change."
          fi
